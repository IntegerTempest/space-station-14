- type: entity
  id: MutagenicCellInjector
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: mutagenic cell injector
  description: Best not to let your fingers get stuck...
  components:
  - type: Machine
    board: MutagenicCellInjectorCircuitboard
  - type: WiresPanel
  - type: Sprite
    sprite: Structures/Machines/Xenobilology/mutagenic_injector.rsi
    layers:
    - state: base
      map: ["base"]
    - state: door-closed
      map: ["enum.MutagenicInjectorVisuals.DoorLayer"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 50
        mask:
        - HighImpassable
        layer:
        - HighImpassable
  - type: Construction
    containers:
    - machine_board
    - machine_parts
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      dishSlot: !type:ContainerSlot
      injector-bodyContainer: !type:ContainerSlot
  - type: EmptyOnMachineDeconstruct
    containers:
    - injector-bodyContainer
  - type: ItemSlots
    slots:
      dishSlot:
        whitelist:
          tags:
          - Dish
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MutagenicInjectorVisuals.DoorState:
        enum.MutagenicInjectorVisuals.DoorLayer:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: CellMutagenicInjector
  - type: GuideHelp
    guides:
    - Science
